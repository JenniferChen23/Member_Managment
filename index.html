<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的會員</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5f5f3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的會員">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f5f3;
    --surface: #ffffff;
    --surface2: #f0efed;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --text: #1a1a18;
    --text2: #6b6b68;
    --text3: #a0a09d;
    --accent: #1a1a18;
    --accent-fg: #ffffff;
    --danger-bg: #fcebeb;
    --danger-text: #a32d2d;
    --radius: 10px;
    --radius-lg: 14px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .app { max-width: 620px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

  /* Header */
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
  .header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .header h1 svg { width: 22px; height: 22px; }
  .top-actions { display: flex; gap: 8px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: transparent; color: var(--text); font-size: 13px; cursor: pointer; transition: background 0.15s; font-weight: 500; }
  .btn:hover { background: var(--surface2); }
  .btn-primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .btn-primary:hover { opacity: 0.85; background: var(--accent); }
  .btn-danger { color: var(--danger-text); border-color: transparent; }
  .btn-danger:hover { background: var(--danger-bg); }

  /* Search */
  .search-wrap { position: relative; margin-bottom: 1rem; }
  .search-wrap svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text3); width: 20px; height: 20px; }
  .search-wrap input { width: 100%; padding: 14px 14px 14px 42px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--surface); color: var(--text); font-size: 17px; outline: none; transition: border-color 0.15s; }
  .search-wrap input:focus { border-color: var(--border2); }
  .count-label { font-size: 12px; color: var(--text3); margin-bottom: 10px; }

  /* Cards */
  .card-list { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
  .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .avatar { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .card-title { font-size: 15px; font-weight: 600; }
  .card-note { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .card-body { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .field { background: var(--surface2); border-radius: var(--radius); padding: 8px 10px; }
  .field-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
  .field-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .field-value { font-size: 13px; color: var(--text); font-family: 'SF Mono', 'Menlo', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: calc(100% - 70px); }
  .icon-btn { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 7px; border: none; background: transparent; color: var(--text2); cursor: pointer; transition: background 0.12s; flex-shrink: 0; }
  .icon-btn:hover { background: var(--border); color: var(--text); }
  .icon-btn svg { width: 15px; height: 15px; }
  .card-actions { display: flex; justify-content: flex-end; gap: 4px; margin-top: 10px; border-top: 0.5px solid var(--border); padding-top: 10px; }

  /* Overlay & Modal */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
  .overlay.show { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 1.5rem; width: 100%; max-width: 400px; }
  .modal h2 { font-size: 16px; font-weight: 600; margin-bottom: 1.25rem; }
  .form-group { margin-bottom: 12px; }
  .form-group label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 5px; font-weight: 500; }
  .form-group input { width: 100%; padding: 9px 11px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px; outline: none; transition: border-color 0.15s; }
  .form-group input:focus { border-color: var(--border2); background: var(--surface); }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 36px; }
  .pw-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text3); display: flex; align-items: center; padding: 4px; }
  .pw-toggle svg { width: 16px; height: 16px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-fg); font-size: 13px; padding: 8px 18px; border-radius: 999px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 200; white-space: nowrap; }
  .toast.show { opacity: 1; }

  /* Empty state */
  .empty { text-align: center; padding: 3rem 1rem; color: var(--text3); }
  .empty svg { width: 40px; height: 40px; margin: 0 auto 12px; display: block; }
  .empty p { font-size: 14px; }

  /* PDF preview */
  .pdf-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .pdf-table th { text-align: left; padding: 8px 10px; background: var(--surface2); color: var(--text2); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
  .pdf-table td { padding: 9px 10px; border-bottom: 0.5px solid var(--border); color: var(--text); }
  .pdf-table tr:last-child td { border-bottom: none; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      我的會員
    </h1>
    <div class="top-actions">
      <button class="btn btn-primary" onclick="openAdd()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新增
      </button>
      <button class="btn" onclick="openExport()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        匯出 PDF
      </button>
    </div>
  </div>

  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="搜尋服務名稱、帳號…" oninput="renderList()">
  </div>

  <p class="count-label" id="countLabel">已儲存 0 筆</p>
  <div class="card-list" id="cardList"></div>
</div>

<!-- Add / Edit Modal -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <h2 id="formTitle">新增帳號密碼</h2>
    <div class="form-group">
      <label>服務名稱 *</label>
      <input type="text" id="fName" placeholder="例：Netflix、銀行帳戶…">
    </div>
    <div class="form-group">
      <label>備註（選填）</label>
      <input type="text" id="fNote" placeholder="簡短說明">
    </div>
    <div class="form-group">
      <label>帳號 / Email *</label>
      <input type="text" id="fUser" placeholder="輸入帳號">
    </div>
    <div class="form-group">
      <label>密碼 *</label>
      <div class="pw-wrap">
        <input type="password" id="fPass" placeholder="輸入密碼">
        <button class="pw-toggle" onclick="toggleFormPw()" type="button">
          <svg id="formEyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeForm()">取消</button>
      <button class="btn btn-primary" onclick="saveEntry()">儲存</button>
    </div>
  </div>
</div>

<!-- Export Modal -->
<div class="overlay" id="exportOverlay">
  <div class="modal" style="max-width:520px">
    <h2>匯出 PDF 預覽</h2>
    <div id="pdfPreview" style="overflow-x:auto;margin-bottom:4px"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeExport()">關閉</button>
      <button class="btn btn-primary" onclick="doPrint()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        列印 / 存 PDF
      </button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="overlay" id="delOverlay">
  <div class="modal" style="max-width:320px">
    <h2>確認刪除？</h2>
    <p style="font-size:14px;color:var(--text2);margin-top:6px">刪除後無法復原。</p>
    <div class="modal-actions">
      <button class="btn" onclick="closeDelete()">取消</button>
      <button class="btn btn-danger" onclick="confirmDelete()">刪除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── IndexedDB ──────────────────────────────────────────
const DB_NAME = 'memberDB', DB_VER = 1, STORE = 'entries';
let db;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => e.target.result.createObjectStore(STORE, { keyPath: 'id' });
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror   = e => rej(e.target.error);
  });
}
function tx(mode = 'readonly') { return db.transaction(STORE, mode).objectStore(STORE); }
function dbGetAll() { return new Promise((res,rej) => { const r=tx().getAll(); r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e.target.error); }); }
function dbPut(entry) { return new Promise((res,rej) => { const r=tx('readwrite').put(entry); r.onsuccess=()=>res(); r.onerror=e=>rej(e.target.error); }); }
function dbDelete(id) { return new Promise((res,rej) => { const r=tx('readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=e=>rej(e.target.error); }); }

// ── State ──────────────────────────────────────────────
let entries = [], editId = null, deleteId = null, formEyeOpen = false;

// ── Color ──────────────────────────────────────────────
const colors = [
  { bg:'#e6f1fb', text:'#185fa5' },
  { bg:'#fcebeb', text:'#a32d2d' },
  { bg:'#eaf3de', text:'#3b6d11' },
  { bg:'#faeeda', text:'#854f0b' },
  { bg:'#fbeaf0', text:'#993556' },
  { bg:'#e1f5ee', text:'#0f6e56' },
];
function colorFor(name) {
  let h = 0;
  for (let c of name) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
  return colors[h % colors.length];
}
function initials(name) { return name.slice(0, 2).toUpperCase(); }

// ── UI helpers ─────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const copyIcon  = () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
const checkIcon = () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>`;
const eyeIcon   = o => o
  ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
  : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
const editIcon  = () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="13" height="13"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
const trashIcon = () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="13" height="13"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;

// ── Render ─────────────────────────────────────────────
function renderList() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = entries.filter(e =>
    e.name.toLowerCase().includes(q) ||
    e.user.toLowerCase().includes(q) ||
    (e.note||'').toLowerCase().includes(q)
  );
  const list = document.getElementById('cardList');
  document.getElementById('countLabel').textContent =
    `已儲存 ${entries.length} 筆${q ? `，符合 ${filtered.length} 筆` : ''}`;

  if (!entries.length) {
    list.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <p>還沒有任何帳號，點擊「新增」開始記錄</p></div>`;
    return;
  }
  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><p>找不到符合「${q}」的結果</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(e => {
    const col = colorFor(e.name);
    return `<div class="card">
      <div class="card-header">
        <div class="avatar" style="background:${col.bg};color:${col.text}">${initials(e.name)}</div>
        <div>
          <div class="card-title">${esc(e.name)}</div>
          ${e.note ? `<div class="card-note">${esc(e.note)}</div>` : ''}
        </div>
      </div>
      <div class="card-body">
        <div class="field">
          <div class="field-label">帳號</div>
          <div class="field-row">
            <span class="field-value" title="${esc(e.user)}">${esc(e.user)}</span>
            <button class="icon-btn" onclick="copyVal('${esc(e.user)}',this)" aria-label="複製帳號">${copyIcon()}</button>
          </div>
        </div>
        <div class="field">
          <div class="field-label">密碼</div>
          <div class="field-row">
            <span class="field-value" id="pw-${e.id}" data-show="0" data-val="${esc(e.pass)}">••••••••</span>
            <div style="display:flex;gap:2px">
              <button class="icon-btn" onclick="toggleCardPw('${e.id}')" aria-label="顯示密碼">${eyeIcon(false)}</button>
              <button class="icon-btn" onclick="copyVal('${esc(e.pass)}',this)" aria-label="複製密碼">${copyIcon()}</button>
            </div>
          </div>
        </div>
      </div>
      <div class="card-actions">
        <button class="btn" style="font-size:12px;padding:5px 10px" onclick="openEdit('${e.id}')">${editIcon()} 編輯</button>
        <button class="btn btn-danger" style="font-size:12px;padding:5px 10px" onclick="openDelete('${e.id}')">${trashIcon()} 刪除</button>
      </div>
    </div>`;
  }).join('');
}

// ── Card interactions ──────────────────────────────────
function toggleCardPw(id) {
  const el = document.getElementById('pw-' + id);
  const showing = el.dataset.show === '1';
  el.dataset.show = showing ? '0' : '1';
  el.textContent = showing ? '••••••••' : el.dataset.val;
  el.parentElement.querySelector('.icon-btn').innerHTML = eyeIcon(!showing);
}
function copyVal(val, btn) {
  navigator.clipboard.writeText(val).catch(() => {});
  btn.innerHTML = checkIcon();
  setTimeout(() => btn.innerHTML = copyIcon(), 1300);
  showToast('已複製到剪貼簿');
}

// ── Add / Edit ─────────────────────────────────────────
function openAdd() {
  editId = null;
  document.getElementById('formTitle').textContent = '新增帳號密碼';
  ['fName','fNote','fUser','fPass'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fPass').type = 'password';
  formEyeOpen = false;
  document.getElementById('formOverlay').classList.add('show');
  setTimeout(() => document.getElementById('fName').focus(), 50);
}
function openEdit(id) {
  const e = entries.find(x => x.id === id); if (!e) return;
  editId = id;
  document.getElementById('formTitle').textContent = '編輯帳號密碼';
  document.getElementById('fName').value = e.name;
  document.getElementById('fNote').value = e.note || '';
  document.getElementById('fUser').value = e.user;
  document.getElementById('fPass').value = e.pass;
  document.getElementById('fPass').type = 'password';
  formEyeOpen = false;
  document.getElementById('formOverlay').classList.add('show');
}
function closeForm() { document.getElementById('formOverlay').classList.remove('show'); }
function toggleFormPw() {
  formEyeOpen = !formEyeOpen;
  document.getElementById('fPass').type = formEyeOpen ? 'text' : 'password';
  document.getElementById('formEyeIcon').outerHTML =
    `<svg id="formEyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${
      formEyeOpen
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
    }</svg>`;
}
async function saveEntry() {
  const name = document.getElementById('fName').value.trim();
  const note = document.getElementById('fNote').value.trim();
  const user = document.getElementById('fUser').value.trim();
  const pass = document.getElementById('fPass').value;
  if (!name || !user || !pass) { showToast('請填寫必填欄位'); return; }
  const entry = editId
    ? { ...entries.find(x => x.id === editId), name, note, user, pass }
    : { id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), name, note, user, pass };
  await dbPut(entry);
  entries = await dbGetAll();
  showToast(editId ? '已更新' : '已新增');
  closeForm(); renderList();
}

// ── Delete ─────────────────────────────────────────────
function openDelete(id) { deleteId = id; document.getElementById('delOverlay').classList.add('show'); }
function closeDelete() { deleteId = null; document.getElementById('delOverlay').classList.remove('show'); }
async function confirmDelete() {
  await dbDelete(deleteId);
  entries = await dbGetAll();
  closeDelete(); renderList(); showToast('已刪除');
}

// ── Export / Print ─────────────────────────────────────
function openExport() {
  if (!entries.length) { showToast('還沒有任何資料可以匯出'); return; }
  const rows = entries.map(e => `<tr>
    <td>${esc(e.name)}</td><td>${e.note ? esc(e.note) : '—'}</td>
    <td>${esc(e.user)}</td><td style="font-family:monospace">${esc(e.pass)}</td>
  </tr>`).join('');
  document.getElementById('pdfPreview').innerHTML = `
    <p style="font-size:15px;font-weight:600;margin-bottom:8px">密碼清單</p>
    <p style="font-size:11px;color:#a0a09d;margin-bottom:12px">匯出時間：${new Date().toLocaleString('zh-TW')}</p>
    <table class="pdf-table">
      <thead><tr><th>服務名稱</th><th>備註</th><th>帳號</th><th>密碼</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  document.getElementById('exportOverlay').classList.add('show');
}
function closeExport() { document.getElementById('exportOverlay').classList.remove('show'); }
function doPrint() {
  const content = document.getElementById('pdfPreview').innerHTML;
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>密碼清單</title>
  <style>
    body{font-family:-apple-system,sans-serif;padding:2rem;color:#1a1a18}
    p{margin-bottom:8px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{text-align:left;padding:8px 10px;background:#f0efed;color:#6b6b68;font-size:11px;font-weight:600;letter-spacing:.04em}
    td{padding:9px 10px;border-bottom:.5px solid rgba(0,0,0,.1)}
    tr:last-child td{border-bottom:none}
  </style></head><body>${content}</body></html>`);
  w.document.close(); w.focus();
  setTimeout(() => w.print(), 300);
}

// ── Keyboard shortcut ──────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeForm(); closeDelete(); closeExport(); }
});

// ── Service Worker ─────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(console.error);
}

// ── Boot ───────────────────────────────────────────────
openDB().then(async () => {
  entries = await dbGetAll();
  renderList();
});
</script>
</body>
</html>
