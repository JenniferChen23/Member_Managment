<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的會員</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
--bg: #f5f5f3; --surface: #ffffff; --surface2: #f0efed;
--border: rgba(0,0,0,0.1); --border2: rgba(0,0,0,0.18);
--text: #1a1a18; --text2: #6b6b68; --text3: #a0a09d;
--accent: #1a1a18; --accent-fg: #ffffff;
--danger-bg: #fcebeb; --danger-text: #a32d2d;
--info-bg: #e6f1fb; --info-text: #185fa5;
--radius: 10px; --radius-lg: 14px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.app { max-width: 620px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
.header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: transparent; color: var(--text); font-size: 13px; cursor: pointer; transition: background 0.15s; font-weight: 500; }
.btn:hover { background: var(--surface2); }
.btn-primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn-primary:hover { opacity: 0.85; background: var(--accent); }
.btn-danger { color: var(--danger-text); border-color: transparent; }
.btn-danger:hover { background: var(--danger-bg); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.search-wrap { position: relative; margin-bottom: 1rem; }
.search-wrap svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text3); width: 20px; height: 20px; }
.search-wrap input { width: 100%; padding: 14px 14px 14px 42px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--surface); color: var(--text); font-size: 17px; outline: none; }
.search-wrap input:focus { border-color: var(--border2); }
.count-label { font-size: 12px; color: var(--text3); margin-bottom: 10px; }
.card-list { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
.card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.avatar { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.card-title { font-size: 15px; font-weight: 600; }
.card-note { font-size: 12px; color: var(--text2); margin-top: 2px; }
.card-body { display: flex; flex-direction: column; gap: 8px; }
.field { background: var(--surface2); border-radius: var(--radius); padding: 8px 10px; }
.field-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.field-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.field-value { font-size: 13px; color: var(--text); font-family: 'SF Mono','Menlo',monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: calc(100% - 70px); }
.icon-btn { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 7px; border: none; background: transparent; color: var(--text2); cursor: pointer; flex-shrink: 0; }
.icon-btn:hover { background: var(--border); color: var(--text); }
.icon-btn svg { width: 15px; height: 15px; }
.card-actions { display: flex; justify-content: flex-end; gap: 4px; margin-top: 10px; border-top: 0.5px solid var(--border); padding-top: 10px; }
.badge-adv { font-size: 10px; padding: 2px 6px; border-radius: 999px; background: var(--info-bg); color: var(--info-text); font-weight: 600; margin-left: 6px; vertical-align: middle; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: flex-start; justify-content: center; padding: 1rem; overflow-y: auto; }
.overlay.show { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 1.5rem; width: 100%; max-width: 420px; margin: auto; }
.modal h2 { font-size: 16px; font-weight: 600; margin-bottom: 1.25rem; }
.form-group { margin-bottom: 12px; }
.form-group label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 5px; font-weight: 500; }
.form-group input, .form-group select { width: 100%; padding: 9px 11px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px; outline: none; appearance: none; }
.form-group input:focus, .form-group select:focus { border-color: var(--border2); background: var(--surface); }
.input-hint { font-size: 11px; color: var(--text3); margin-top: 4px; }
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 36px; }
.pw-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text3); display: flex; padding: 4px; }
.pw-toggle svg { width: 16px; height: 16px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; }
.modal-tabs { display: flex; gap: 6px; margin-bottom: 1.25rem; }
.tab-btn { flex: 1; padding: 8px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: transparent; color: var(--text2); font-size: 13px; cursor: pointer; font-weight: 500; transition: all 0.15s; }
.tab-btn.active { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.adv-field-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.adv-field-row input { flex: 1; padding: 8px 10px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--surface2); color: var(--text); font-size: 13px; outline: none; }
.adv-field-row input:focus { border-color: var(--border2); background: var(--surface); }
.adv-field-row select { width: 80px; padding: 8px 4px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--surface2); color: var(--text); font-size: 12px; outline: none; appearance: none; text-align: center; flex-shrink: 0; }
.add-field-btn { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--info-text); background: none; border: none; cursor: pointer; padding: 4px 0; }
.setting-row { padding: 12px 0; border-bottom: 0.5px solid var(--border); }
.setting-row:last-of-type { border-bottom: none; }
.setting-label { font-size: 14px; font-weight: 500; }
.setting-desc { font-size: 12px; color: var(--text2); margin-top: 2px; margin-bottom: 8px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-fg); font-size: 13px; padding: 8px 18px; border-radius: 999px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 200; white-space: nowrap; }
.toast.show { opacity: 1; }
.empty { text-align: center; padding: 3rem 1rem; color: var(--text3); }
.empty svg { width: 40px; height: 40px; margin: 0 auto 12px; display: block; }
.empty p { font-size: 14px; }
.pdf-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.pdf-table th { text-align: left; padding: 8px 10px; background: var(--surface2); color: var(--text2); font-size: 11px; font-weight: 600; }
.pdf-table td { padding: 9px 10px; border-bottom: 0.5px solid var(--border); }
.pdf-table tr:last-child td { border-bottom: none; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="22" height="22"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      我的會員
    </h1>
    <div class="top-actions">
      <button class="btn btn-primary" onclick="openAdd()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新增
      </button>
      <button class="btn" onclick="openSettings()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>設定
      </button>
      <button class="btn" onclick="openExport()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>匯出
      </button>
    </div>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="搜尋服務名稱、帳號…" oninput="renderList()">
  </div>
  <p class="count-label" id="countLabel">載入中…</p>
  <div class="card-list" id="cardList"></div>
</div>

<!-- Add/Edit Modal -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <h2 id="formTitle">新增帳號密碼</h2>
    <div class="modal-tabs" id="formTabs">
      <button class="tab-btn active" onclick="switchTab('normal')">一般</button>
      <button class="tab-btn" onclick="switchTab('advanced')">進階</button>
    </div>
    <div id="normalForm">
      <div class="form-group"><label>服務名稱 *</label><input type="text" id="fName" placeholder="例：Netflix、銀行帳戶…"></div>
      <div class="form-group"><label>備註（選填）</label><input type="text" id="fNote" placeholder="簡短說明"></div>
      <div class="form-group">
        <label>帳號 / Email（選填）</label>
        <input type="text" id="fUser" placeholder="留空則使用預設帳號">
        <p class="input-hint" id="defaultHint"></p>
      </div>
      <div class="form-group"><label>密碼 *</label>
        <div class="pw-wrap">
          <input type="password" id="fPass" placeholder="輸入密碼">
          <button class="pw-toggle" onclick="toggleFormPw()" type="button">
            <svg id="formEyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div id="advancedForm" style="display:none">
      <div class="form-group"><label>服務名稱 *</label><input type="text" id="afName" placeholder="例：悠遊卡、健保卡…"></div>
      <div class="form-group"><label>備註（選填）</label><input type="text" id="afNote" placeholder="簡短說明"></div>
      <div class="adv-fields-wrap">
        <label style="font-size:12px;color:var(--text2);font-weight:500;display:block;margin-bottom:8px">自訂欄位（選填）</label>
        <div id="advFieldList"></div>
        <button class="add-field-btn" onclick="addAdvField()" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新增欄位
        </button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeForm()">取消</button>
      <button class="btn btn-primary" onclick="saveEntry()">儲存</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h2>設定</h2>
    <div class="setting-row">
      <div class="setting-label">預設帳號</div>
      <div class="setting-desc">新增時帳號欄位留空會自動帶入</div>
      <input type="text" id="defaultAccountInput" placeholder="輸入預設帳號 / Email" style="width:100%;padding:9px 11px;border-radius:var(--radius);border:0.5px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;outline:none;">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeSettings()">取消</button>
      <button class="btn btn-primary" onclick="saveSettings()">儲存</button>
    </div>
  </div>
</div>

<!-- Export Modal -->
<div class="overlay" id="exportOverlay">
  <div class="modal" style="max-width:520px">
    <h2>匯出 PDF 預覽</h2>
    <div id="pdfPreview" style="overflow-x:auto;margin-bottom:4px"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeExport()">關閉</button>
      <button class="btn btn-primary" onclick="doPrint()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>列印 / 存 PDF
      </button>
    </div>
  </div>
</div>

<!-- Delete Confirm -->
<div class="overlay" id="delOverlay">
  <div class="modal" style="max-width:320px">
    <h2>確認刪除？</h2>
    <p style="font-size:14px;color:var(--text2);margin-top:6px">刪除後無法復原。</p>
    <div class="modal-actions">
      <button class="btn" onclick="closeDelete()">取消</button>
      <button class="btn btn-danger" onclick="confirmDelete()">刪除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── IndexedDB 初始化 ───────────────────────────────────
const DB_NAME = 'MemberMgmt';
const DB_VERSION = 1;
const STORE_ENTRIES = 'entries';
const STORE_SETTINGS = 'settings';

let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);

    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_ENTRIES)) {
        d.createObjectStore(STORE_ENTRIES, { keyPath: 'id' });
      }
      if (!d.objectStoreNames.contains(STORE_SETTINGS)) {
        d.createObjectStore(STORE_SETTINGS, { keyPath: 'key' });
      }
    };

    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e.target.error);
  });
}

// ── DB helpers ────────────────────────────────────────
function dbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = e => reject(e.target.error);
  });
}

function dbPut(storeName, obj) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const req = tx.objectStore(storeName).put(obj);
    req.onsuccess = () => resolve();
    req.onerror = e => reject(e.target.error);
  });
}

function dbDelete(storeName, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const req = tx.objectStore(storeName).delete(key);
    req.onsuccess = () => resolve();
    req.onerror = e => reject(e.target.error);
  });
}

// ── App state ─────────────────────────────────────────
let entries = [];
let settings = { defaultAccount: '' };
let editId = null, deleteId = null, formEyeOpen = false, currentTab = 'normal';

// ── 載入資料 ──────────────────────────────────────────
async function loadData() {
  entries = await dbGetAll(STORE_ENTRIES);

  // 第一次開啟：寫入 demo 資料
  if (entries.length === 0) {
    const demos = [
      { id: 'demo1', type: 'normal', name: 'GitHub', note: '工作用', user: 'work@email.com', pass: 'Gh@SecurePass1' },
      { id: 'demo2', type: 'normal', name: 'Google', note: '主要帳戶', user: 'myname@gmail.com', pass: 'GoPassW0rd#2' },
      { id: 'demo3', type: 'advanced', name: '悠遊卡', note: '捷運用', fields: [
        { label: '卡號', value: '1234-5678-9012', fieldType: 'text' },
        { label: 'PIN碼', value: '9527', fieldType: 'password' },
      ]},
    ];
    for (const d of demos) await dbPut(STORE_ENTRIES, d);
    entries = demos;
  }

  const settingsRows = await dbGetAll(STORE_SETTINGS);
  const found = settingsRows.find(r => r.key === 'main');
  if (found) settings = found.value;

  renderList();
}

// ── Colors ────────────────────────────────────────────
const colors = [
  {bg:'#e6f1fb',text:'#185fa5'},{bg:'#fcebeb',text:'#a32d2d'},
  {bg:'#eaf3de',text:'#3b6d11'},{bg:'#faeeda',text:'#854f0b'},
  {bg:'#fbeaf0',text:'#993556'},{bg:'#e1f5ee',text:'#0f6e56'},
];
function colorFor(n) { let h=0; for (let c of n) h=(h*31+c.charCodeAt(0))&0xffff; return colors[h%colors.length]; }
function initials(n) { return n.slice(0,2).toUpperCase(); }
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// ── Toast ─────────────────────────────────────────────
function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Icons ─────────────────────────────────────────────
const copyIcon  = () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
const checkIcon = () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>`;
const eyeIcon   = o => o
  ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
  : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
const editIcon  = () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="13" height="13"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
const trashIcon = () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="13" height="13"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;

// ── Render ────────────────────────────────────────────
function renderList() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = entries.filter(e =>
    e.name.toLowerCase().includes(q) ||
    (e.user||'').toLowerCase().includes(q) ||
    (e.note||'').toLowerCase().includes(q) ||
    (e.fields||[]).some(f => (f.label+f.value).toLowerCase().includes(q))
  );
  const list = document.getElementById('cardList');
  document.getElementById('countLabel').textContent = `已儲存 ${entries.length} 筆${q ? `，符合 ${filtered.length} 筆` : ''}`;

  if (!entries.length) {
    list.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><p>還沒有任何帳號，點擊「新增」開始記錄</p></div>`;
    return;
  }
  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><p>找不到符合「${q}」的結果</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(e => {
    const col = colorFor(e.name);
    const isAdv = e.type === 'advanced';
    let fieldsHtml = '';

    if (isAdv) {
      fieldsHtml = (e.fields||[]).filter(f => f.label||f.value).map((f, i) => {
        const isPw = f.fieldType === 'password';
        const pwId = `pw-${e.id}-${i}`;
        return `<div class="field"><div class="field-label">${esc(f.label||'欄位')}</div><div class="field-row">${isPw
          ? `<span class="field-value" id="${pwId}" data-show="0" data-val="${esc(f.value)}">••••••••</span>`
          : `<span class="field-value">${esc(f.value)}</span>`
        }<div style="display:flex;gap:2px">${isPw ? `<button class="icon-btn" onclick="togglePw('${pwId}')">${eyeIcon(false)}</button>` : ''}<button class="icon-btn" onclick="copyVal('${esc(f.value)}',this)">${copyIcon()}</button></div></div></div>`;
      }).join('');
    } else {
      const hasUser = e.user && e.user.trim();
      fieldsHtml = (hasUser
        ? `<div class="field"><div class="field-label">帳號</div><div class="field-row"><span class="field-value">${esc(e.user)}</span><button class="icon-btn" onclick="copyVal('${esc(e.user)}',this)">${copyIcon()}</button></div></div>`
        : '') +
        `<div class="field"><div class="field-label">密碼</div><div class="field-row"><span class="field-value" id="pw-${e.id}" data-show="0" data-val="${esc(e.pass)}">••••••••</span><div style="display:flex;gap:2px"><button class="icon-btn" onclick="togglePw('pw-${e.id}')">${eyeIcon(false)}</button><button class="icon-btn" onclick="copyVal('${esc(e.pass)}',this)">${copyIcon()}</button></div></div></div>`;
    }

    return `<div class="card"><div class="card-header"><div class="avatar" style="background:${col.bg};color:${col.text}">${initials(e.name)}</div><div><div class="card-title">${esc(e.name)}${isAdv ? '<span class="badge-adv">進階</span>' : ''}</div>${e.note ? `<div class="card-note">${esc(e.note)}</div>` : ''}</div></div><div class="card-body">${fieldsHtml}</div><div class="card-actions"><button class="btn btn-sm" onclick="openEdit('${e.id}')">${editIcon()} 編輯</button><button class="btn btn-sm btn-danger" onclick="openDelete('${e.id}')">${trashIcon()} 刪除</button></div></div>`;
  }).join('');
}

function togglePw(pwId) {
  const el = document.getElementById(pwId); if (!el) return;
  const showing = el.dataset.show === '1';
  el.dataset.show = showing ? '0' : '1';
  el.textContent = showing ? '••••••••' : el.dataset.val;
  el.parentElement.querySelector('.icon-btn').innerHTML = eyeIcon(!showing);
}

function copyVal(val, btn) {
  navigator.clipboard.writeText(val).catch(() => {});
  btn.innerHTML = checkIcon();
  setTimeout(() => btn.innerHTML = copyIcon(), 1300);
  showToast('已複製到剪貼簿');
}

// ── Tabs ──────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('normalForm').style.display = tab === 'normal' ? '' : 'none';
  document.getElementById('advancedForm').style.display = tab === 'advanced' ? '' : 'none';
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (i===0&&tab==='normal')||(i===1&&tab==='advanced')));
}

// ── Adv fields ────────────────────────────────────────
function addAdvField(label='', value='', fieldType='text') {
  const wrap = document.getElementById('advFieldList');
  const row = document.createElement('div');
  row.className = 'adv-field-row';
  row.innerHTML = `<input type="text" placeholder="欄位名稱" value="${esc(label)}" data-role="label"><input type="text" placeholder="內容" value="${esc(value)}" data-role="value"><select data-role="type"><option value="text"${fieldType==='text'?' selected':''}>文字</option><option value="password"${fieldType==='password'?' selected':''}>密碼</option></select><button class="icon-btn" onclick="this.parentElement.remove()" type="button" style="color:var(--danger-text)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
  wrap.appendChild(row);
}

function getAdvFields() {
  return [...document.querySelectorAll('#advFieldList .adv-field-row')].map(r => ({
    label: r.querySelector('[data-role="label"]').value.trim(),
    value: r.querySelector('[data-role="value"]').value,
    fieldType: r.querySelector('[data-role="type"]').value,
  }));
}

// ── Add / Edit ────────────────────────────────────────
function openAdd() {
  editId = null;
  document.getElementById('formTitle').textContent = '新增帳號密碼';
  switchTab('normal');
  ['fName','fNote','fUser','fPass'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fPass').type = 'password';
  formEyeOpen = false;
  document.getElementById('advFieldList').innerHTML = '';
  ['afName','afNote'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('defaultHint').textContent = settings.defaultAccount ? `預設帳號：${settings.defaultAccount}` : '';
  document.getElementById('formOverlay').classList.add('show');
  setTimeout(() => document.getElementById('fName').focus(), 50);
}

function openEdit(id) {
  const e = entries.find(x => x.id === id); if (!e) return;
  editId = id;
  document.getElementById('formTitle').textContent = '編輯';
  if (e.type === 'advanced') {
    switchTab('advanced');
    document.getElementById('afName').value = e.name;
    document.getElementById('afNote').value = e.note || '';
    document.getElementById('advFieldList').innerHTML = '';
    (e.fields||[]).forEach(f => addAdvField(f.label, f.value, f.fieldType));
  } else {
    switchTab('normal');
    document.getElementById('fName').value = e.name;
    document.getElementById('fNote').value = e.note || '';
    document.getElementById('fUser').value = e.user || '';
    document.getElementById('fPass').value = e.pass || '';
    document.getElementById('fPass').type = 'password';
    formEyeOpen = false;
    document.getElementById('defaultHint').textContent = settings.defaultAccount ? `預設帳號：${settings.defaultAccount}` : '';
  }
  document.getElementById('formOverlay').classList.add('show');
}

function closeForm() { document.getElementById('formOverlay').classList.remove('show'); }

function toggleFormPw() {
  formEyeOpen = !formEyeOpen;
  document.getElementById('fPass').type = formEyeOpen ? 'text' : 'password';
  document.getElementById('formEyeIcon').outerHTML = `<svg id="formEyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${formEyeOpen
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
  }</svg>`;
}

async function saveEntry() {
  let entry;
  if (currentTab === 'advanced') {
    const name = document.getElementById('afName').value.trim();
    if (!name) { showToast('請填寫服務名稱'); return; }
    const note = document.getElementById('afNote').value.trim();
    const fields = getAdvFields();
    entry = editId
      ? { ...entries.find(x => x.id === editId), name, note, fields, type: 'advanced' }
      : { id: uid(), name, note, fields, type: 'advanced' };
  } else {
    const name = document.getElementById('fName').value.trim();
    const pass = document.getElementById('fPass').value;
    if (!name || !pass) { showToast('請填寫服務名稱與密碼'); return; }
    const note = document.getElementById('fNote').value.trim();
    const userInput = document.getElementById('fUser').value.trim();
    const user = userInput || settings.defaultAccount || '';
    entry = editId
      ? { ...entries.find(x => x.id === editId), name, note, user, pass, type: 'normal' }
      : { id: uid(), name, note, user, pass, type: 'normal' };
  }

  await dbPut(STORE_ENTRIES, entry);
  if (editId) {
    entries = entries.map(x => x.id === editId ? entry : x);
  } else {
    entries.push(entry);
  }

  showToast(editId ? '已更新' : '已新增');
  closeForm();
  renderList();
}

// ── Delete ────────────────────────────────────────────
function openDelete(id) { deleteId = id; document.getElementById('delOverlay').classList.add('show'); }
function closeDelete() { deleteId = null; document.getElementById('delOverlay').classList.remove('show'); }

async function confirmDelete() {
  await dbDelete(STORE_ENTRIES, deleteId);
  entries = entries.filter(x => x.id !== deleteId);
  closeDelete();
  renderList();
  showToast('已刪除');
}

// ── Settings ──────────────────────────────────────────
function openSettings() {
  document.getElementById('defaultAccountInput').value = settings.defaultAccount || '';
  document.getElementById('settingsOverlay').classList.add('show');
}
function closeSettings() { document.getElementById('settingsOverlay').classList.remove('show'); }

async function saveSettings() {
  settings.defaultAccount = document.getElementById('defaultAccountInput').value.trim();
  await dbPut(STORE_SETTINGS, { key: 'main', value: settings });
  closeSettings();
  showToast('設定已儲存');
}

// ── Export ────────────────────────────────────────────
function openExport() {
  if (!entries.length) { showToast('還沒有任何資料可以匯出'); return; }
  const rows = entries.map(e => {
    if (e.type === 'advanced') {
      const fs = (e.fields||[]).map(f => `${f.label}：${f.value}`).join(' / ');
      return `<tr><td>${esc(e.name)} <span style="font-size:10px;color:#185fa5">[進階]</span></td><td>${e.note ? esc(e.note) : '—'}</td><td colspan="2" style="font-size:12px;font-family:monospace">${esc(fs)}</td></tr>`;
    }
    return `<tr><td>${esc(e.name)}</td><td>${e.note ? esc(e.note) : '—'}</td><td>${esc(e.user||'—')}</td><td style="font-family:monospace">${esc(e.pass||'')}</td></tr>`;
  }).join('');
  document.getElementById('pdfPreview').innerHTML = `<p style="font-size:15px;font-weight:600;margin-bottom:8px">密碼清單</p><p style="font-size:11px;color:#a0a09d;margin-bottom:12px">匯出時間：${new Date().toLocaleString('zh-TW')}</p><table class="pdf-table"><thead><tr><th>服務名稱</th><th>備註</th><th>帳號</th><th>密碼 / 欄位</th></tr></thead><tbody>${rows}</tbody></table>`;
  document.getElementById('exportOverlay').classList.add('show');
}
function closeExport() { document.getElementById('exportOverlay').classList.remove('show'); }

function doPrint() {
  const content = document.getElementById('pdfPreview').innerHTML;
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>密碼清單</title><style>body{font-family:-apple-system,sans-serif;padding:2rem;color:#1a1a18}p{margin-bottom:8px}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;padding:8px 10px;background:#f0efed;color:#6b6b68;font-size:11px;font-weight:600}td{padding:9px 10px;border-bottom:.5px solid rgba(0,0,0,.1)}tr:last-child td{border-bottom:none}</style></head><body>${content}</body></html>`);
  w.document.close(); w.focus(); setTimeout(() => w.print(), 300);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeForm(); closeDelete(); closeExport(); closeSettings(); }
});

// ── 啟動 ──────────────────────────────────────────────
openDB().then(loadData).catch(err => {
  document.getElementById('countLabel').textContent = 'IndexedDB 初始化失敗';
  console.error(err);
});
</script>
</body>
</html>
